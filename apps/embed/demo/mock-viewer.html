<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>mock viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
        background: #101820;
        color: #e8ecef;
      }
      body {
        display: flex;
        flex-direction: column;
        padding: 8px;
        box-sizing: border-box;
        gap: 6px;
      }
      h4 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }
      .btns {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      button {
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 4px;
        border: 1px solid #3a4650;
        background: #1c2731;
        color: #e8ecef;
        cursor: pointer;
      }
      button:hover {
        background: #2a3742;
      }
      #log {
        flex: 1;
        overflow: auto;
        font: 10px/1.4 ui-monospace, monospace;
        background: #0a0f14;
        border-radius: 4px;
        padding: 6px;
      }
    </style>
  </head>
  <body>
    <h4 id="title">mock viewer</h4>
    <div class="btns">
      <button id="btn-hello">hello</button>
      <button id="btn-lot-click">lotClick</button>
      <button id="btn-lead-intent">leadIntent</button>
      <button id="btn-deeplink">deeplink</button>
      <button id="btn-error">error</button>
      <button id="btn-fullscreen">fullscreen fallback</button>
      <button id="btn-exit-fullscreen">exit fullscreen</button>
      <button id="btn-resize-tall">resize tall</button>
    </div>
    <div id="log"></div>
    <script src="/demo/dist/mock-viewer.js"></script>
  </body>
</html>
