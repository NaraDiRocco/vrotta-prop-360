name: CI

# Corre en push a main y en pull requests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verificacion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm va ANTES que setup-node: el cache de setup-node necesita el
      # binario de pnpm ya instalado para resolver el store, y al revés falla
      # con "Unable to locate executable file: pnpm".
      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Chequeo de tipos
        run: pnpm typecheck

      - name: Tests
        run: pnpm test
