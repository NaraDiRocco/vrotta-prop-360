packages:
  - "packages/*"
  - "apps/*"
  # Sólo tools/deploy, no "tools/*": tools/baleia y tools/blender son
  # material Python sin package.json, ajenos a pnpm. tools/deploy entra acá
  # nada más que para que `pnpm -r test` levante
  # tools/deploy/reconciliador-dominios.test.mjs (ver ese package.json).
  - "tools/deploy"
